apply plugin: 'com.android.application'
apply plugin: 'io.sentry.android.gradle'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = System.getenv('EDGE_RELEASE_STORE_FILE') ?: keystoreProperties['storeFile']
def releaseStorePassword = System.getenv('EDGE_RELEASE_STORE_PASSWORD') ?: keystoreProperties['storePassword']
def releaseKeyAlias = System.getenv('EDGE_RELEASE_KEY_ALIAS') ?: keystoreProperties['keyAlias']
def releaseKeyPassword = System.getenv('EDGE_RELEASE_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
def sentryDsn = System.getenv('SENTRY_ANDROID_DSN') ?: project.findProperty('SENTRY_ANDROID_DSN') ?: ''

// Play rejects an upload whose versionCode is not strictly greater than every
// previous one, so a hard-coded value fails on the second release. CI sets
// EDGE_VERSION_CODE (e.g. the build number); local builds fall back to 1 so
// day-to-day development is unaffected.
def edgeVersionCode = Integer.parseInt(System.getenv('EDGE_VERSION_CODE') ?: '1')
def edgeVersionName = System.getenv('EDGE_VERSION_NAME') ?: '1.0'
def sentryUploadConfigured = [
    System.getenv('SENTRY_AUTH_TOKEN'),
    System.getenv('SENTRY_ORG'),
    System.getenv('SENTRY_PROJECT')
].every { it != null && !it.toString().trim().isEmpty() }
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.toString().trim().isEmpty() }
android {
    namespace = "com.edgecipline"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.edgecipline"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode edgeVersionCode
        versionName edgeVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [sentryDsn: sentryDsn]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

sentry {
    includeProguardMapping = true
    autoUploadProguardMapping = sentryUploadConfigured
    includeSourceContext = sentryUploadConfigured
    autoInstallation {
        enabled = false
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseRequested = taskGraph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains('release')
    }
    if (releaseRequested && !releaseSigningConfigured) {
        throw new GradleException(
            'Release signing is not configured. Set EDGE_RELEASE_* environment variables ' +
            'or create an untracked android/keystore.properties file.'
        )
    }
    if (releaseRequested && sentryDsn.toString().trim().isEmpty()) {
        throw new GradleException('Release observability is not configured. Set SENTRY_ANDROID_DSN.')
    }
    if (releaseRequested && !sentryUploadConfigured) {
        throw new GradleException(
            'Release mapping upload is not configured. Set SENTRY_AUTH_TOKEN, SENTRY_ORG, and SENTRY_PROJECT.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // WorkManager — schedules checklist notification jobs (survives reboots)
    implementation "androidx.work:work-runtime:2.9.1"

    // Google Play Billing — Android in-app subscriptions (EdgeBillingPlugin).
    // Play enforces a MINIMUM Billing Library version for new uploads and it
    // moves roughly once a year; check the current floor in Play Console before
    // a release rather than assuming this pin still qualifies.
    implementation "com.android.billingclient:billing:$playBillingVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
