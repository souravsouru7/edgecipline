name: Deploy To EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
      - ".gitignore"
      - ".env.example"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Secret and artifact scan
        run: node scripts/security-scan.js
      - name: Mojibake scan
        run: node scripts/check-mojibake.js
      - name: Lint
        run: npm run lint --if-present
        working-directory: backend
      - name: Test
        run: npm test --if-present
        working-directory: backend

  deploy:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/stratedge
            git config --global --add safe.directory ~/stratedge || true
            git fetch origin main
            git reset --hard origin/main

            cd ~/stratedge/backend
            npm install

            pm2 delete stratedge-api || true
            pm2 delete stratedge-ocr-worker || true
            pm2 start ecosystem.config.js || pm2 restart ecosystem.config.js
            pm2 save

            # Health check — wait up to 30s for the API to respond
            for i in $(seq 1 6); do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/ || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed (HTTP $STATUS)"
                exit 0
              fi
              echo "Attempt $i: HTTP $STATUS — retrying..."
            done
            echo "Health check failed after 30s" && exit 1
